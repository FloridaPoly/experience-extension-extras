name: Dependency verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

concurrency:
  group: dependency-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Audit, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install from the lockfile without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit the complete dependency graph
        run: npm audit --audit-level=high

      # The repository has no test script. Its existing ESLint configuration
      # imports undeclared plugins that do not all support the ESLint 10 pin;
      # make that a separate tooling repair instead of silently weakening lint.
      - name: Build CommonJS, ESM, and type declarations
        run: npm run build

      - name: Require committed package outputs to match the build
        run: git diff --exit-code -- lib

      - name: Smoke test the CommonJS package entry point
        run: >-
          node -e "global.React=require('react');
          const api=require('.');
          if (!Object.keys(api).length) process.exit(1)"

      - name: Inspect the publish allowlist without publishing
        run: npm pack --dry-run --ignore-scripts --json
